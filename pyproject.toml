[project]
name = "mini-agent"
version = "0.2.0"
description = "Local lightweight programming agent — no smolagents dependency"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
]

[project.scripts]
mini-agent = "mini_agent.agent:main"

[tool.setuptools.packages.find]
where = ["src"]
